name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Debug auth
        run: |
          echo "=== Active accounts ==="
          gcloud auth list

          echo "=== gcloud config ==="
          gcloud config list

          echo "=== Verify project access ==="
          gcloud projects describe all-we-are-master-database

          echo "=== Enabled APIs (Cloud Build + Cloud Run) ==="
          gcloud services list --enabled --project=all-we-are-master-database \
            --filter="name:(cloudbuild OR run.googleapis)" --format="table(name,state)"

          echo "=== Runtime SA exists? ==="
          gcloud iam service-accounts describe \
            inverter-logger-runtime@all-we-are-master-database.iam.gserviceaccount.com \
            --project=all-we-are-master-database

          echo "=== Cloud Build SA IAM on runtime SA ==="
          gcloud iam service-accounts get-iam-policy \
            inverter-logger-runtime@all-we-are-master-database.iam.gserviceaccount.com \
            --project=all-we-are-master-database

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: inverter-logger
          region: us-east4
          source: .
          flags: >-
            --no-allow-unauthenticated
            --service-account=inverter-logger-runtime@all-we-are-master-database.iam.gserviceaccount.com
            --memory=512Mi
            --timeout=540
            --max-instances=1
